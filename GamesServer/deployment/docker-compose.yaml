services:

  backend:
    image: games-backend:latest
    container_name: games-backend
    build:
      context: ../backend/
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      LLM_URL: "http://vllm:9000/v1/chat/completions"
      LLM_MODEL: "Qwen/Qwen2.5-1.5B-Instruct"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "game_db"
      DB_USER: "postgres"
      DB_USER_PASSWORD: "Sup3rSecret0"
      DB_MIN_POOL: "1"
      DB_MAX_POOL: "10"
    networks:
      - default
    depends_on:
      - db
      - vllm

  frontend:
    image: games-frontend:latest
    container_name: games-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "8002:80"
    networks:
      - default
    depends_on:
      - backend


networks:
  default:
    name: uno-network
    external: true


