global:
  scrape_interval: 5s
  evaluation_interval: 30s



scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: vllm
    static_configs:
      - targets:
          - 'host.docker.internal:9000'
  - job_name: 'postgres'
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-exporter:9187']


